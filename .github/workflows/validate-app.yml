name: Validate Phong Thuy App
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js && node --check backup.js && node --check sw.js
      - name: Check advanced house tool JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('phong-thuy-nha-nang-cao.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Advanced house tool has no inline JavaScript');
          fs.writeFileSync('/tmp/advanced-house.js', scripts[scripts.length - 1][1]);
          for (const id of ['birth','gender','built','facing','bearing','annualStars','palaceGrid','landAudit','roomTips','saveEvent']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing advanced house feature: ' + id);
          }
          console.log('Advanced house UI entry points found');
          NODE
          node --check /tmp/advanced-house.js
      - name: Run Bát Trạch unit tests
        run: node tests/bat-trach.test.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json valid')"
      - name: Validate current UI and core calculations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const requiredIds = [
            'panel-personal','panel-calendar','panel-home','panel-library',
            'liveCompassDial','calibrateCompass','resetCompassCalibration','startCompass','stopCompass',
            'profileForm','birthYear','gender','personalResult',
            'lunarDateInput','convertLunarDate','lunarDateResult',
            'solarTermsYear','showSolarTerms','solarTermsResult',
            'homeAuditOptions','runHomeAudit','homeAuditResult'
          ];
          for (const id of requiredIds) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing current UI element: ' + id);
          }
          const requiredFunctions = ['calcCung','convertSolarToLunar','renderLunarDate','calculateSolarTerms','renderSolarTerms','startCompass','normalizeDegrees','runHomeAudit'];
          for (const name of requiredFunctions) {
            if (!js.includes(name)) throw new Error('Missing feature entry point: ' + name);
          }
          const vm = require('vm');
          const store = new Map();
          const document = {
            getElementById() { return null; },
            querySelectorAll() { return []; },
            addEventListener() {},
            createElementNS() { return { setAttribute(){}, appendChild(){}, textContent:'' }; }
          };
          const window = { addEventListener(){}, isSecureContext:true };
          const context = {
            document, window, localStorage: { getItem(k){return store.has(k)?store.get(k):null;}, setItem(k,v){store.set(k,String(v));} },
            console, Math, Date, Number, String, Object, Array, JSON, Set, Map,
            alert(){}, confirm(){return true;}, prompt(){return null;},
            screen:{orientation:{angle:0}}, navigator:{}, setTimeout(){}, URL, Blob
          };
          vm.createContext(context);
          vm.runInContext(js + ';globalThis.__lunar=convertSolarToLunar;globalThis.__cung=calcCung;globalThis.__terms=calculateSolarTerms;globalThis.__normalize=normalizeDegrees;globalThis.__validEvent=isValidEvent;', context);
          for (const [solar, expected] of [
            [[10,2,2024],[1,1,2024]], [[29,1,2025],[1,1,2025]], [[17,2,2026],[1,1,2026]]
          ]) {
            const actual = context.__lunar(...solar,7);
            if (!actual || actual.day!==expected[0] || actual.month!==expected[1] || actual.year!==expected[2]) throw new Error('Lunar reference date failed: '+solar.join('-')+' -> '+JSON.stringify(actual));
          }
          if (context.__lunar(31,2,2025,7)!==null) throw new Error('Invalid calendar date must be rejected');
          if (context.__lunar(29,2,2024,7)===null) throw new Error('Valid leap day must be accepted');
          if (!context.__validEvent({title:'Chuyển nhà',date:'2026-10-29',note:'',id:1})) throw new Error('Valid event was rejected');
          for (const event of [
            {title:'   ',date:'2026-10-29',note:'',id:1},
            {title:'Sai ngày',date:'2025-02-31',note:'',id:1},
            {title:'Sai định dạng',date:'29/10/2026',note:'',id:1},
            {title:'',date:'2026-10-29',note:'',id:1}
          ]) if (context.__validEvent(event)) throw new Error('Invalid event was accepted: '+JSON.stringify(event));
          if (context.__terms(1899)!==null || context.__terms(2100)!==null) throw new Error('Solar-term year range validation failed');
          for (const year of [1990,2000,2001,2026]) for (const gender of ['nam','nu']) {
            const result=context.__cung(year,gender);
            if(!result || !result.name || !result.group) throw new Error('Ba Trach failed: '+year+' '+gender);
          }
          const terms=context.__terms(2026);
          if(!terms || terms.length!==24) throw new Error('Expected 24 solar terms for 2026; got '+(terms&&terms.length));
          const lapXuan=terms.find(x=>x.name==='Lập xuân');
          if(!lapXuan || lapXuan.date.getUTCMonth()!==1 || lapXuan.date.getUTCDate()<3 || lapXuan.date.getUTCDate()>5) throw new Error('Lập xuân date outside expected range');
          for (const [value, expected] of [[360,0],[-1,359],[721,1]]) {
            if(context.__normalize(value)!==expected) throw new Error('Compass degree normalization failed: '+value);
          }
          console.log('Current UI IDs and core calculation tests passed');
          NODE
