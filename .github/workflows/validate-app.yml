name: Validate Phong Thuy App
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js && node --check backup.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json valid')"
      - name: Check required app sections
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const required = ['panel-personal','panel-home','panel-calendar','panel-library'];
          for (const id of required) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing section: ' + id);
          }
          for (const token of ['calcCung','renderRoom','renderEvents','bearingName','shareText','convertSolarToLunar','renderLunarDate','runHomeAudit','calculateSolarTerms','renderSolarTerms']) {
            if (!js.includes(token)) throw new Error('Missing feature: ' + token);
          }
          if (!html.includes('id="homeAuditOptions"') || !html.includes('id="runHomeAudit"')) throw new Error('Home audit UI missing');
          console.log('Required sections and feature entry points present');
          const vm = require('vm');
          const context = { document: { addEventListener() {} }, localStorage: { getItem(){return null}, setItem(){} }, console, Math, Date, Number, String, Object, Array, JSON, location: { href: 'test' }, navigator: {} };
          vm.createContext(context);
          vm.runInContext(js + ';globalThis.__lunar = convertSolarToLunar; globalThis.__cung = calcCung; globalThis.__terms = calculateSolarTerms;', context);
          for (const [solar, expected] of [
            [[10,2,2024],[1,1,2024]], [[29,1,2025],[1,1,2025]], [[17,2,2026],[1,1,2026]]
          ]) {
            const actual = context.__lunar(...solar,7);
            if (!actual || actual.day!==expected[0] || actual.month!==expected[1] || actual.year!==expected[2]) throw new Error('Lunar reference date failed: '+solar.join('-')+' -> '+JSON.stringify(actual));
          }
          for (const year of [1990,2000,2001,2026]) for (const gender of ['nam','nu']) {
            const result=context.__cung(year,gender); if(!result||!result.name||!result.group) throw new Error('Ba Trach failed: '+year+' '+gender);
          }
          const terms = context.__terms(2026);\n          if (!terms || terms.length !== 24) throw new Error('Solar term count invalid');\n          const lichXuan = terms.find(x => x.name === 'Lập xuân');\n          if (!lichXuan || lichXuan.date.getUTCMonth() !== 1 || lichXuan.date.getUTCDate() < 3 || lichXuan.date.getUTCDate() > 5) throw new Error('Lập xuân reference date outside expected range');\n          console.log('Lunar, Ba Trach, home audit and solar term checks passed');

          NODE
